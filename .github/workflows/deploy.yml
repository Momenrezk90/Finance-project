name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: false
        default: "main"

# Static concurrency group — deploy-{env_name} (never uses github.ref)
# Per master spec Section 11: deploy concurrency ensures FIFO queuing
concurrency:
  group: deploy-production
  cancel-in-progress: false   # HARDCODED — cancelling a deploy corrupts server state (constraint #1)

# Minimum permissions — always present (master spec constraint #8)
permissions:
  contents: read

jobs:





  # ─────────────────────────────────────────────────────────
  # SSH Git-Pull Deploy with multi-layer health check + auto-rollback
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://15.223.217.7

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          envs: DEPLOY_TOKEN
          script_stop: true
          script: |
            #!/bin/bash
            # Generated by CI/CD Platform — do not edit manually
            # Pattern C Deploy Script — runs on the remote server via SSH
            # Variables: d = DeployScriptConfig
            #
            # NON-NEGOTIABLE (master spec constraint #2):
            # set -euo pipefail MUST be the first executable line — always.
            set -euo pipefail

            DEPLOY_DIR="${{ secrets.DEPLOY_DIR }}"
            DEPLOY_REF="${{ github.event.inputs.ref || 'main' }}"
            REPO="${{ github.repository }}"
            echo "=== Deploying ${DEPLOY_REF} to ${DEPLOY_DIR} (as $(id -un)) ==="

            # ─────────────────────────────────────────────────────────────────────
            # Git Authentication — supports two modes:
            #   1. HTTPS with token (DEPLOY_TOKEN env var) — most reliable
            #   2. SSH with Deploy Key (APP_PRIVATE_KEY env var) — per-repo key
            # ─────────────────────────────────────────────────────────────────────
            GIT_CLONE_URL=""
            if [ -n "${DEPLOY_TOKEN:-}" ]; then
              # HTTPS mode — uses GitHub token, no SSH key issues at all
              GIT_CLONE_URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/${REPO}.git"
              echo "=== Git auth: HTTPS token mode ==="
            elif [ -n "${APP_PRIVATE_KEY:-}" ]; then
              # SSH mode — use the injected deploy key exclusively
              mkdir -p "${HOME}/.ssh"
              KEY_PATH="${HOME}/.ssh/deploy_key_${{ github.repository_id }}"
              printf '%s\n' "${APP_PRIVATE_KEY}" > "${KEY_PATH}"
              chmod 600 "${KEY_PATH}"
              export GIT_SSH_COMMAND="ssh -i ${KEY_PATH} -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
              GIT_CLONE_URL="git@github.com:${REPO}.git"
              echo "=== Git auth: SSH deploy key mode ==="
            else
              # Fallback — try default SSH credentials on the server
              GIT_CLONE_URL="git@github.com:${REPO}.git"
              echo "=== Git auth: default server SSH credentials ==="
            fi

            # Check if directory exists and is a git repository
            if [ ! -d "${DEPLOY_DIR}/.git" ]; then
              echo "=== Initial Deployment: Cloning Repository ==="
              mkdir -p "${DEPLOY_DIR}"
              git clone "${GIT_CLONE_URL}" "${DEPLOY_DIR}"
            fi

            cd "${DEPLOY_DIR}"

            # Update remote URL to match the chosen auth method
            git remote set-url origin "${GIT_CLONE_URL}"

            # Ensure Node.js tools (npx, pm2) are on PATH regardless of install method
            export NVM_DIR="${HOME}/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" 2>/dev/null || true
            export PATH="${HOME}/.npm-global/bin:/usr/local/bin:${PATH}"


            # Capture current HEAD for rollback
            PREV_SHA="$(git rev-parse HEAD)"
            echo "Current HEAD: ${PREV_SHA}"

            # Fetch and update
            git fetch --all --prune
            git reset --hard
            git checkout "${DEPLOY_REF}"
            git pull --ff-only origin "${DEPLOY_REF}"

            NEW_SHA="$(git rev-parse HEAD)"
            echo "New HEAD:     ${NEW_SHA}"

            # Execute Deployment Commands
            npm install
            npx pm2 delete "Finance-project" 2>/dev/null || true
            npx pm2 start backend/server.js --name "Finance-project"

            echo "=== Waiting for the stack to become healthy ==="
            HEALTHY=0

            for i in $(seq 1 30); do
              CHECK_1_OK=0

              if curl -fsS -o /dev/null http://localhost:5000/api/health 2>/dev/null; then CHECK_1_OK=1; fi

              if [ "${CHECK_1_OK}" = 1 ]; then
                HEALTHY=1
                echo "All 1 layers healthy after ${i}x2s"
                break
              fi

              echo "Attempt $i/30 — CHECK_1_OK=${CHECK_1_OK}"
              sleep 2
            done

            if [ "${HEALTHY}" != 1 ]; then
              echo "=== HEALTH CHECK FAILED — rolling back to ${PREV_SHA} ==="
              # Show diagnostic logs (docker or pm2, whichever is available)
              if command -v docker &>/dev/null; then
                docker compose logs --tail=100 2>/dev/null || true
              fi
              if command -v npx &>/dev/null; then
                npx pm2 logs --nostream --lines 50 2>/dev/null || true
              fi
              git reset --hard "${PREV_SHA}"
              npm install
            npx pm2 delete "Finance-project" 2>/dev/null || true
            npx pm2 start backend/server.js --name "Finance-project"
              exit 1
            fi

            echo "=== Deploy OK: ${PREV_SHA} -> ${NEW_SHA} ==="
            # Show running processes
            if command -v npx &>/dev/null && npx pm2 list 2>/dev/null | grep -q "online"; then
              npx pm2 list
            elif command -v docker &>/dev/null; then
              docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null || true
            fi
