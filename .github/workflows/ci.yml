name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

# Scoped concurrency — cancels stale CI runs on same branch (never across branches)
# Per master spec Section 11: CI concurrency group is always ci-${{ github.ref }}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions — always present (master spec constraint #8)
permissions:
  contents: read
  actions: read

jobs:


  # ─────────────────────────────────────────────────────────
  # Frontend lint — JavaScript syntax check + HTML validation
  # ─────────────────────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          for dir in backend backend/controllers backend/middlewares backend/models backend/routes backend/services backend/utils frontend/src frontend/src/components frontend/src/pages ; do
            for f in $(find "$dir" -name "*.js" -not -path "*/node_modules/*"); do
              node --check "$f" || exit 1
            done
          done
          echo "All JS files passed syntax check"

      - name: Validate HTML
        run: npx --yes html-validate@latest 

